[project]
name = "smi-ai-auditor"
version = "0.1.0"
description = "AI Auditor for SME compliance"
dependencies = [
    "haystack-ai>=2.10.0",
    "qdrant-client",
    "mistralai",
    "docling>=2.15.0",
    "pydantic>=2.10.0",
    "python-dotenv",
    "structlog",
    "langfuse",
    "weasyprint",
    "jinja2",
    "markdown",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

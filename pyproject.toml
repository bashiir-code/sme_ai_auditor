[project]
name = "sme-ai-auditor"
version = "0.1.0"
description = "Sovereign AI Compliance-as-a-Service for EU AI & Data Act"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.84.0",
    "mistralai",
    "langfuse",
    "pytest",
    "pytest-asyncio",
    "structlog",
    "pydantic>=2.10.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
